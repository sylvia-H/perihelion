<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>銅版星圖</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1440px;height:900px;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#172033 0,#0E1420 60%,#090D16 100%);color:#E9E1CC;font:400 14px/1.5 "IM Fell DW Pica","Noto Serif TC",serif;position:relative}
.orb{position:absolute;left:720px;top:480px;border:1px solid rgba(233,225,204,.42);border-radius:50%;transform:translate(-50%,-50%)}
.dial{position:absolute;left:720px;top:480px;width:1240px;height:520px;border-radius:50%;transform:translate(-50%,-50%);border:1px solid #B89A5B;outline:1px dashed rgba(184,154,91,.7);outline-offset:9px}
.sun{position:absolute;left:720px;top:480px;width:96px;height:96px;margin:-48px;border-radius:50%;background:radial-gradient(circle,#F6E7B8 0,#D9B25F 55%,#B8863A 100%);box-shadow:0 0 0 14px rgba(217,178,95,.14),0 0 0 34px rgba(217,178,95,.07)}
.pl{position:absolute;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 34% 30%,var(--a) 0,var(--b) 55%,#0b0f18 100%)}
.ring{position:absolute;border:1px solid #E9E1CC;border-radius:50%;transform:translate(-50%,-50%) rotate(-16deg)}
.lb{position:absolute;font-style:italic;font-size:17px;white-space:nowrap}
.lb small{display:block;font-style:normal;font-size:11px;letter-spacing:.22em;color:#B89A5B}
.star{position:absolute;width:5px;height:5px;border-radius:50%;background:#E9E1CC}
.ln{position:absolute;height:1px;background:rgba(233,225,204,.5);transform-origin:0 50%}
.hd{position:absolute;left:44px;top:36px}
.hd h1{font-size:30px;font-weight:400;letter-spacing:.08em}
.hd p{font-size:12px;letter-spacing:.24em;color:#B89A5B;margin-top:4px}
.tm{position:absolute;right:48px;top:34px;text-align:right}
.tm b{font-size:64px;font-weight:400;line-height:1}
.tm p{font-size:12px;letter-spacing:.24em;color:#B89A5B}
.cmd{position:absolute;left:420px;right:420px;bottom:42px;border-bottom:1px solid #E9E1CC;padding:8px 2px;font-style:italic;color:rgba(233,225,204,.6);font-size:16px}
.cap{position:absolute;font-size:11px;letter-spacing:.22em;color:#B89A5B}
</style></head><body>
<div class="hd"><h1>近日點</h1><p>丙午年十一月十二日 · 今晚四顆</p></div>
<div class="tm"><b>25:00</b><p>按空白鍵開始專注</p></div>
<div class="dial"></div>
<div class="orb" style="width:360px;height:150px"></div><div class="orb" style="width:560px;height:234px"></div>
<div class="orb" style="width:780px;height:326px"></div><div class="orb" style="width:1000px;height:418px"></div>
<div class="sun"></div>
<div class="pl" style="--a:#F0B49A;--b:#C8452F;left:552px;top:452px;width:30px;height:30px"></div><div class="lb" style="left:430px;top:398px">回覆 HR 的到職日信件<small>壹 · 0／1</small></div>
<div class="ring" style="left:934px;top:404px;width:92px;height:26px"></div>
<div class="pl" style="--a:#CFE0D8;--b:#4E7C74;left:934px;top:404px;width:50px;height:50px"></div><div class="lb" style="left:978px;top:356px">題庫 E 區塊 44–58<small>貳 · 2／3</small></div>
<div class="pl" style="--a:#EAD9A6;--b:#A8873F;left:420px;top:585px;width:42px;height:42px"></div><div class="lb" style="left:300px;top:618px">教材 C 第 5 章<small>參 · 1／2</small></div>
<div class="pl" style="--a:#C9CFE6;--b:#56628F;left:1130px;top:600px;width:64px;height:64px"></div><div class="lb" style="left:1010px;top:646px">演算法：二分搜尋兩題<small>肆 · 0／4</small></div>
<div class="pl" style="--a:#E6D3D8;--b:#8C5A68;left:548px;top:284px;width:28px;height:28px"></div><div class="lb" style="left:574px;top:252px">整理面試提問表<small>伍 · 0／1</small></div>
<div class="star" style="left:1088px;top:120px"></div><div class="star" style="left:1150px;top:96px"></div><div class="star" style="left:1206px;top:138px"></div><div class="star" style="left:1168px;top:184px"></div>
<div class="ln" style="left:1090px;top:122px;width:66px;transform:rotate(-21deg)"></div><div class="ln" style="left:1152px;top:98px;width:70px;transform:rotate(37deg)"></div><div class="ln" style="left:1208px;top:140px;width:60px;transform:rotate(130deg)"></div>
<div class="cap" style="left:1100px;top:200px">十一月十一日 · 四顆</div>
<div class="star" style="left:250px;top:150px"></div><div class="star" style="left:318px;top:176px"></div><div class="star" style="left:300px;top:230px"></div>
<div class="ln" style="left:252px;top:152px;width:72px;transform:rotate(21deg)"></div><div class="ln" style="left:320px;top:178px;width:57px;transform:rotate(108deg)"></div>
<div class="cap" style="left:236px;top:250px">十一月十日 · 三顆</div>
<div class="cmd">新增一顆行星，例：讀教材 D ×2</div>
</body></html>
